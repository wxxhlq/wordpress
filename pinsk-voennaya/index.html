<style>
  html,body{margin:0;padding:0;background:#e7ece7}

  }

<script>
const NEW = [{"n":"д. Бастычи","d":"Дата уничтожения: март 1943 г.\nКол-во домов до войны: 103\nКол-во людей до войны:484\nРазрушено домов: 28\nУбито людей: 2","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":24.8762,"y":44.326,"lat":52.2174336,"lng":25.9738962,"gmaps":"https://www.google.com/maps/place/52.21743,25.97390","imgs":[],"audio":"bastychi"},{"n":"д. Бокиничи","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 785\nДомов до войны: 154\nУбито людей: 9\nРазрушено домов: 140\nДата уничтожения: апрель 1943 г.\nПамятник детям — жертвам второй мировой войны в деревне Бокиничи Пинского района был установлен в 2013 году в память о детях – жертвах второй мировой войны. Памятник был установлен по инициативе Терезы Станиславовны Скирмунт из знаменитого древнего полесского рода, которая здесь родилась и вынужденно уехала во время войны. В памятнике собирательный образ безвинных младенцев отражен через судьбу конкретной девочки, сестры Терезы Станиславовны — Гражины, которая, не дожив до двух лет, умерла от голода. «Нет больше войны, нет больше голода» — распорядилась высечь на камне Т.С. Скирмунт.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":67.0625,"y":38.5799,"lat":52.2857614,"lng":26.400549,"gmaps":"https://www.google.com/maps/place/52.28576,26.40055","imgs":["assets/img/4B0678AE32EA27FD_1.png"],"audio":"bokinichi"},{"n":"д. Березцы","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 825\nДомов до войны: 205\nУбито людей: 25\nРазрушено домов: 203\nДата уничтожения: не установлено\nОбелиск установлен в 1968г. на могиле 10 советских воинов и партизан, которые погибли на территории сельсовета в годы Великой Отечественной войны в борьбе с немецко-фашистскими захватчиками.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":87.1562,"y":61.2426,"lat":52.1194572,"lng":26.5955154,"gmaps":"https://www.google.com/maps/place/52.11946,26.59552","imgs":["assets/img/4B06647B4266F3C8_1.png"],"audio":""},{"n":"д. Богдановка","d":"Довоенный район: Пинский\nПослевоенный район: Лунинецкий\nДата разрушения: не установлено\nКоличество домов до войны: 509 \nСОЖЖЕНА ПОЛНОСТЬЮ.\nПеред Великой Отечественной войной в селе проживало 1637 человек, насчитывалось 509 домов. В апреле 1944 года гитлеровцы сожгли дома и убили 34 жителя. 83 человека из Богдановки погибли на фронтах и в партизанах. В 1973 году в их память установлен обелиск.\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":65.7219,"y":35.3746,"lat":52.367118,"lng":26.453333,"gmaps":"https://www.google.com/maps/place/52.36712,26.45333","imgs":["assets/img/5795B1ED6C32BF5E_1.png"],"audio":""},{"n":"д. Большие Дворцы","d":"Памятник землякам в д. Кнубово установлен в честь увековечения памяти 70 жителей деревни Большие Дворцы, Велятичи, Диковичи, Кнубово, Сернички, которые погибли в годы войны.\n Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 526\nДомов до войны: 139\nУбито людей: 0\nРазрушено домов: 138\nДата уничтожения: июль 1944 г.\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":45.9869,"y":78.5527,"lat":52.0036892,"lng":26.1630082,"gmaps":"https://www.google.com/maps/place/52.00369,26.16301","imgs":["assets/img/4B067A38F3958564_1.png"],"audio":""},{"n":"д. Бобрик","d":"Дата уничтожения: май 1944 г.\nКол-во домов до войны: 88\nКол-во людей до войны: 352\nРазрушено домов: 77\nУбито людей: 0\nПамятник землякам установлен перед Домом культуры в 1966 г. на увековечивание памяти 106 односельчан, которые погибли в годы Великой Отечественной войны, а также в послевоенное время от рук врагов советской власти. \n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":58.625,"y":12.1893,"lat":52.4700000001,"lng":26.30680000032,"gmaps":"https://www.google.com/maps/place/52.47000,26.30680","imgs":["assets :["assets/img/4B068248352C98F8_1.png"],"audio":""},{"n":"д. Дубновичи","d":"Довоенный район: Пинский\nДата уничтожения: апрель 1943 г.\nЛюдей до войны: 907\nДомов до войны: 250\nУбито людей: 23\nРазрушено домов: 250\n В 2011 году был установлен Памятный знак в честь увековечения памяти сожжённой деревни Дубновичи и жителей, угнанных в Германию в годы Великой Отечественной войны.Памятник расположен в центре населённого пункта, в виде сруба полусгоревшего дома, как память о тех трагических страницах истории деревни Дубновичи.В феврале 1943 года через деревню прошло партизанское соединение Ковпака, численностью около 3 тысяч человек, двигающееся из Брянских лесов в Закарпатье. Партизаны прорывались с боями через Парохонск, Селище, Молодельчицы в сторону деревни Ласицк. Реки Бобрик и Припять форсировали по льду. Проводником народных мстителей, на участке от Дубновичей до Ласицка, был житель деревни Дубновичи Пилевич Александр Карпович. Через два дня после прохода партизан, рано утром, Дубновичи окружили каратели. Они начали поджигать дома и стрелять зажигательными пулями. Часть жителей смогла вырваться из окружения и скрыться в лесу. Южную и центральную часть деревни фашисты сожгли дотла. Второй раз каратели нагрянули в Дубновичи весной, на Пасху. Людей собрали в центре деревне, выстроили в колонну и, под охраной, направили на станцию Парохонск, для отправки в Германию. Жилища сельчан полностью сожгли. Деревня превратилась в чёрную безжизненную пустыню. С февраля по апрель 1943 года, во время карательных операций в Дубновичах, фашисты расстреляли 23 мирных жителя. \n\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":69.9062,"y":39.7633,"lat":52.277154,"lng":26.428193,"gmaps":"https://www.google.com/maps/place/52.27715,26.42819","imgs":["assets/img/4B0683D1E663A6FB_1.png"],"audio":"dubnovichi"},{"n":"д. Плещицы","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 683\nДомов до войны: 192\nУбито людей: 0\nРа ие семьи – Боричевских и Протасовицких, их с особой жестокостью убили пособники фашистов.\nБратская могила советских воинов и партизан д. Жолкино.Обелиск установлен в 1967г. возле клуба на могиле 55 воинов, партизан и местных жителей, которые погибли в 1941-1944гг.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":61.1875,"y":89.3491,"lat":51.908782,"lng":26.335077,"gmaps":"https://www.google.com/maps/place/51.90878,26.33508","imgs":["assets/img/4B068C6EF1D450EA_1.png","assets/img/4B068C6EF1D450EA_2.png"],"audio":"zholkino"},{"n":"д. Погост Загородский","d":"Дата разрушения: 1942\nКоличество домов до войны: 120\nКоличество людей до войны:1220\nРазрушено домов: 15\nУбито людей: 1200\nВ юго-западной части деревни Камень похоронены 600 жителей д.Погост-Загородск еврейской национальности, расстрелянных фашистами 15.08.1942г. при ликвидации гетто. Стелла установлена бывшим жителем д.Погост-Загородск Михаилом Южуком. В 1998г. здесь состоялось перезахоронение останков с ликвидированного еврейского кладбища в д.Камень.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":64.9231,"y":36.6503,"lat":52.2834089,"lng":26.3518086,"gmaps":"https://www.google.com/maps/place/52.28341,26.35181","imgs":["assets/img/5795EF2F93EFF2EF_1.png","assets/img/5795EF2F93EFF2EF_2.png","assets/img/5795EF2F93EFF2EF_3.png"],"audio":"pogost-zagorodskiy"},{"n":"д. Лопатин","d":"Довоенный район: Пинский\nДата уничтожения: май 1944 г.\nЛюдей до войны: 489\nДомов до войны: 140\nУбито людей: 0\nРазрушено домов: 125\nПамятник-обелиск установлен в 1965г. в центре деревни на могиле 32 советских воинов, которые погибли в годы Великой Отечественной войны на территории сельсовета. Датой захоронения считается 11 июля 1944г.\nНа мемориальных досках увековечены имена 97 жителей деревень Колбы, Конюхи, Лопатин, Лосичи, Полхово, Хлябы, погибших на фронтах и в партизанах, а также замученных гитлеровцами.\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":63.875,"y":76.0355,"lat":52.0201274,"lng":26.3301775,"gmaps":"https://www.google.com/maps/place/52.02013,26.33018","imgs":["assets/img/4B068DCAECE1B34D_1.png"],"audio":""},{"n":"д. Кнубово","d":"Довоенный район: Пинский\nДовоенная область: \tПинская\nЛюдей до войны: 588\nДомов до войны: \t153\nУбито людей: 1\nРазрушено домов:\t107\nДата разрушения: \t1944 г.\nПамятник землякам в д. Кнубово установлен в честь увековечения памяти 70 жителей деревни Большие Дворцы, Велятичи, Диковичи, Кнубово, Сернички, которые погибли в годы войны. \n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":46.6875,"y":71.1538,"lat":52.0524728,"lng":26.1701686,"gmaps":"https://www.google.com/maps/place/52.05247,26.17017","imgs":["assets/img/4B068F0E75982383_1.png"],"audio":""},{"n":"д. Сачковичи","d":"Довоенный район: Пинский\nДата уничтожения: не установлено\nЛюдей до войны: 310\nДомов до войны: 102\nУбито людей: 0\nРазрушено домов: 22\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":46.3438,"y":72.3876,"lat":52.0468824,"lng":26.1394737,"gmaps":"https://www.google.com/maps/place/52.04688,26.13947","imgs":["assets/img/4B0690B79512FB12_1.png"],"audio":""},{"n":"д. Кривое Село","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 46\nДомов до войны: 13\nУбито людей: 0\nРазрушено домов: 11\nДата уничтожения: июль 1944 г.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":56.7,"y":69.1254,"lat":52.053948,"lng":26.271739,"gmaps":"https://www.google.com/maps/place/52.05395,26.27174","imgs":[],"audio":""},{"n":"д. Селище","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 425\nДомов до войны: 124\nУбито людей: 0\nРазрушено домов: 20\nДата уничтожения: не установлено\n23 ноября – освобождены деревни Гайшин, Славня, Селище, Тереховка, Черняковка, Перегон, Ректа, Малая Зимница, Большая З юнь 1943 г., май 1944 г.Во время войны деревня находилась в зоне действия партизан. В июне 1943 года фашистские каратели сожгли ее дотла вместе с людьми. Известно, что Любель-Поль, как и Хатынь, уничтожил 118-й карательный батальон шуцманшафта – коллаборационистское подразделение охранной полиции. В огне и от пуль нелюдей погибли в основном старики, женщины и дети. Их имена, а также имена тринадцати односельчан, которые пали смертью храбрых, сражаясь на фронтах и в партизанских отрядах, начертаны на памятнике.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":45.9688,"y":47.2485,"lat":52.2234358,"lng":26.1749685,"gmaps":"https://www.google.com/maps/place/52.22344,26.17497","imgs":["assets/img/4B069C00B9319C5B_1.png"],"audio":"lyubel-pol"},{"n":"д. Морозовичи","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 506\nДомов до войны: 116\nУбито людей: 0\nРазрушено домов: 32\nДата уничтожения: июль 1944 г.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":58.4375,"y":73.2373,"lat":52.03875,"lng":26.277951,"gmaps":"https://www.google.com/maps/place/52.03875,26.27795","imgs":[],"audio":""},{"n":"д. Черново 1","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 302\nДомов до войны: 75\nУбито людей: 0\nРазрушено домов: 20\nДата уничтожения: не установлено\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":63.3206,"y":67.2024,"lat":52.0818528,"lng":26.3632064,"gmaps":"https://www.google.com/maps/place/52.08185,26.36321","imgs":[],"audio":""},{"n":"д. Малые Дворцы","d":"Довоенный район: Пинский \nДовоенная область: Пинская\nЛюдей до войны: 248\nДомов до войны: 61\nУбито людей: 0\nРазрушено домов: 61\nДата уничтожения: июль 1944 г.\nНа гражданском кладбище памятник «пирамида». На памятнике надпись «Здесь покоятся останки воинов 12-й стрелковой гвардейской дивизии , павших при освобождении деревни Малые Дворцы 3-5 июля 1944 года».","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":45.5938,"y":79.5562,"lat":52.0006151,"lng":26.1419307,"gmaps":"https://www.google.com/maps/place/52.00062,26.14193","imgs":["assets/img/4B06A4F200209DFE_1.png"],"audio":""},{"n":"д. Малые Диковичи","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 178\nДомов до войны: 40\nУбито людей: 0\nРазрушено домов: 40\nДата уничтожения: июль 1944 г.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":44.9369,"y":78.3893,"lat":52.0050692,"lng":26.112974,"gmaps":"https://www.google.com/maps/place/52.00507,26.11297","imgs":[],"audio":""},{"n":"д. Молодельчицы","d":"Довоенный район: Пинский\nДовоенная область: Пинская\nЛюдей до войны: 498\nДомов до войны: 117\nУбито людей: 12\nРазрушено домов: 102\nДата уничтожения: ноябрь 1943 г.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":71.7794,"y":55.3911,"lat":52.140518,"lng":26.491563,"gmaps":"https://www.google.com/maps/place/52.14052,26.49156","imgs":[],"audio":""},{"n":"д. Невель","d":"Довоенная область:Пинская\nДата разрушения:декабрь 1942 г.; май 1943 г.\nДомов до войны:153\nРазрушено домов:150\nЛюдей до войны:633\nУбито людей:188\nОбелиск установлен в 1981 г. на увековечивание памяти 196 односельчан, которые были расстреляны фашистами, и 28 земляков, которые погибли на фронтах Великой Отечественной войны. \n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":18.2812,"y":87.5148,"lat":51.9293499,"lng":25.8500194,"gmaps":"https://www.google.com/maps/place/51.92935,25.85002","imgs":["assets/img/5790460F700311C6_1.png"],"audio":"nevel"},{"n":"д. Лисятичи","d":"Кол-во домов до войны; 37\nКол-во людей до войны: 138\nРазрушено домов: 34\nУбито людей: 0\nОбелиск установлен в 1968 г. Деревня Лисятичи в июле 1944 г. была полностью сожжена немецко-фашистскими захватчиками. После войны возродилась. \n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":24.5938,"y":43.284,"lat":52.23620000033,"lng":25.961899999685,"gmaps":"https://www.google.com/maps/place/52.23620,25.96190","imgs":["assets/img/5792B24E19D0E4BC_1.png"],"audio":""},{"n":"д. Доброславка","d":"Довоенный район: Пинский район\nЛюдей до войны: 672\nДомов до войны: 168\nУбито людей: 16\nРазрушено домов: 87\nДата уничтожения: 2 мая 1944г","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":56.4125,"y":18.8751,"lat":52.4042044,"lng":26.2453741,"gmaps":"https://www.google.com/maps/place/52.40420,26.24537","imgs":[],"audio":"dobroslavka"},{"n":"д. Семенча","d":"В послевоенные годы так и не была восстановлена. Деревня Семенча располагалась на расстоянии примерно 5 километров, к северу, от ныне существующей деревни Чемерин, входящей в состав Поречского сельсовета. \nВ деревне Поречье, у братской могилы советских воинов и партизан, открыли табличку с QR-кодом, по которому можно выйти на информацию об уничтоженных фашистами и не восстановившихся после войны деревнях Семенча и Проходы.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":13.8131,"y":28.9521,"lat":52.364058,"lng":25.782557,"gmaps":"https://www.google.com/maps/place/52.36406,25.78256","imgs":["assets/img/5792BC2948C4FB81_1.png","assets/img/5792BC2948C4FB81_2.png"],"audio":"semencha"},{"n":"д. Домашицы","d":"Довоенный район: Пинский    \nЛюдей до войны: 630\nДомов до войны: 106\nУбито людей: 0\nРазрушено домов: 50\nДата уничтожения: 1944г.\nВ память о 39 жителях деревень Домашицы, Жабчицы, Залесье, Молотковичи. Обелиск установлен в 1968 г. \n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":27.9062,"y":63.1657,"lat":52.110521,"lng":25.9732574,"gmaps":"https://www.google.com/maps/place/52.11052,25.97326","imgs":["assets/img/57986BA7F368AA9A_1.png"],"audio":""},{"n":"д. Жабчицы","d":"Район: Пинский район\nЛюдей до войны: 350\nДомов до войны: 79\nУбито людей: 0\nРазрушено домов: 70\nДата уничтожения: август 1944г.\nФашисты жгли Жабчицы дважды: 22 июня 1941 года при первом налете вражеской авиации было уничтожено 40 дворов, погибло около 30 местных жителей; во время бомбежки в июле 1944-го здесь сгорело 70 дворов, жертвами стали 26 человек.\nНа бывшем военном аэродроме Жабчицы в июне 2012 года установлен памятный знак, напоминающий о трагическом событии начала Великой Отечественной войны. \nПамятник погибшим жителям в годы войны установлен в деревне Домашицы открыт 1 июля 2026 года","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":28.2187,"y":60.4734,"lat":52.1294894,"lng":25.971994,"gmaps":"https://www.google.com/maps/place/52.12949,25.97199","imgs":["assets/img/5798E58D5955DC22_1.png","assets/img/5798E58D5955DC22_2.png","assets/img/5798E58D5955DC22_3.png"],"audio":"zhabchicy"},{"n":"д. Жидче","d":"Район: Пинский\nЛюдей до войны: 712\nДомов до войны: 117\nУбито людей: 0\nРазрушено домов: 32\nДата уничтожения: не установлено","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":25.155,"y":72.6272,"lat":51.95718549999999,"lng":25.9441897,"gmaps":"https://www.google.com/maps/place/51.95719,25.94419","imgs":[],"audio":""},{"n":"д. Изин","d":"Район: Пинский район\nЛюдей до войны: 150\nДомов до войны: 30\nУбито людей: 1\nРазрушено домов: 30\nДата уничтожения: август 1943г.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":25.9913,"y":65.2231,"lat":52.0495724,"lng":25.9223709,"gmaps":"https://www.google.com/maps/place/52.04957,25.92237","imgs":[],"audio":""},{"n":"д. Клетная","d":"Район: Пинский район\nЛюдей до войны: 420\nДомов до войны: 130\nУбито людей: 12\nРазрушено домов: 32\nДата уничтожения: апрель 1944г.\nРасполагается на территории гражданского кладбища в деревне Клетное. В братской могиле № 209 захоронено 8 местных жителей – советских активистов, расстрелянных немецкими захватчиками 14 августа 1941 года, при выселении жителей деревни во время карательной операции в Беловежской пуще. ","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":8.6562,"y":19.7929,"lat":52.4200642,"lng":25.7452092,"gmaps":"https://www.google.com/maps/place/52.42006,25.74521","imgs":["assets/img/5798EDB0EA4C63E0_1.png"],"audio":""},{"n":"д. Липники","d":"Район: Пинский район\nЛюдей до войны: 202\nДомов до войны: 60\nУбито людей: 7\nРазрушено домов: 31\nДата уничтожения: июнь 1944г.\nДеревня Орёл находилась в 1 км к югу от д. Липники, на берегу Днепро-Бугского канала. 22.12.1943 г. немецко-фашистские оккупанты уничтожили 27 жителя","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":49.6875,"y":12.1302,"lat":52.4698946,"lng":26.179431,"gmaps":"https://www.google.com/maps/place/52.46989,26.17943","imgs":["assets/img/5798EFC18A350377_1.png"],"audio":"lipniki"},{"n":"д. Логишин","d":"Район: Пинский район\nЛюдей до войны: 2820\nДомов до войны: 267\nУбито людей: 19\nРазрушено домов: 140\nДата уничтожения: не утсановлена\nВ 1967 году установлен памятник.«29.12.1943г. в д.Задубье прибыли эсэсовцы из Малькович, полицаи из Ганцевич и Логишина, всего около 200 человек.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":30.8437,"y":31.0355,"lat":52.3344758,"lng":25.9897336,"gmaps":"https://www.google.com/maps/place/52.33448,25.98973","imgs":["assets/img/5798F246886BD11F_1.png"],"audio":"logishin"},{"n":"д. Малая Вулька","d":"Район: Пинский район\nЛюдей до войны: 242\nДомов до войны: 65\nУбито людей: 0\nРазрушено домов: 21\nДата уничтожения: не установлено\nВ 1960 году останки красноармейцев из одиночных и малых братских могил деревень Вулька.В братской могиле деревни Огородники захоронены 81 (74 известных, 7 неизвестных) воинов Красной Армии, ","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":30.2994,"y":70.3805,"lat":51.9891505,"lng":26.0021258,"gmaps":"https://www.google.com/maps/place/51.98915,26.00213","imgs":["assets/img/5798F4AEBE9157F4_1.png"],"audio":""},{"n":"д. Молотковичи","d":"Район: Пинский район\nДата уничтожения: не установлено\nЛюдей до войны: 650\nДомов до войны: 113\nУбито людей: 0\nРазрушено домов: 35\nБратская могила советских воинов и партизан аг. Молотковичи.\nПамятник – скульптура солдата – установлен в 1957г. в центре деревни. Похоронено 99 воинов и партизан, которые погибли в борьбе с немецко-фашистскими захватчиками в годы Великой Отечественной войны на территории сельсовета. Среди захороненных – Шая Иосифович Беркович (1918 – 1942) и Владимир Григорьевич Немытов (1898 – 1942)\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":22.75,"y":62.2485,"lat":52.1175535,"lng":25.9213765,"gmaps":"https://www.google.com/maps/place/52.11755,25.92138","imgs":["assets/img/5798F5FE027B4B4A_1.png"],"audio":"molotkovichi"},{"n":"д. Плоскинь","d":"Район: Пинский район\nЛюдей до войны: 608\nДомов до войны: 152\nУбито людей: 6\nРазрушено домов: 123\nДата уничтожения: июль 1944г. \nОбелиск установлен в 1970г. в центре деревни на увековечивание памяти 64 земляков, которые погибли на фронтах Великой Отечественной войны, и 15 мирных жителей - жертв фашизма.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":54.9375,"y":14.3491,"lat":52.4568689,"lng":26.2665212,"gmaps":"https://www.google.com/maps/place/52.45687,26.26652","imgs":["assets/img/5798F7ACA3A3918F_1.png"],"audio":""},{"n":"д. Плотница","d":"Район: Пинский район\nЛюдей до войны: 544\nДомов до войны: 136\nУбито людей: 11\nРазрушено домов: 131\nДата уничтожения: май 1944г.\nВ лесу вблизи деревни Малая Плотница благоустроена могила, в которой захоронена Розжаловец Ульяна с младенцем, погибшие от рук фашистов в годы Великой Отечественной войны. 30 октября 2025 года открыли памятный знак","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":60.9062,"y":24.8467,"lat":52.4653764,"lng":26.4075072,"gmaps":"https://www.google.com/maps/place/52.46538,26.40751","imgs":["assets/img/5798FB24CF84694C_1.png"],"audio":"malaya-plotnica"},{"n":"д. Поречье","d":"Район: Пинский район\nЛюдей до войны: 995\nДомов до войны: 298\nУбито людей: 20\nРазрушено домов: 39\nДата уничтожения: март 1944г.\nВ центре деревни похоронено 10 воинов и партизан, которые погибли в боях против немецко-фашистских захватчиков в 1944г. Обелиск установлен в 1956г.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":13.9688,"y":39.1716,"lat":52.2813135,"lng":25.8153921,"gmaps":"https://www.google.com/maps/place/52.28131,25.81539","imgs":["assets/img/5798FDB606631735_1.png"],"audio":""},{"n":"д. Проходы","d":"Район: Пинский район\nЛюдей до войны: 123\nДомов до войны: 27\nУбито людей: не установлено\nРазрушено домов: 10\nДата уничтожения: не установлено\nСогласно полученным свидетельским показаниям, в годы Великой Отечественной войны, населённый пункт был уничтожен немецко-фашистскими захватчиками и их венгерскими пособниками.\nВ деревне Поречье, у братской могилы советских воинов и партизан, торжественно открыли табличку с QR-кодом, по которому можно выйти на информацию об уничтоженных фашистами и не восстановившихся после войны деревнях Семенча и Проходы.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":15.7275,"y":36.4775,"lat":52.3330717,"lng":25.7942361,"gmaps":"https://www.google.com/maps/place/52.33307,25.79424","imgs":["assets/img/5798FEBDBC551C60_1.png","assets/img/5798FEBDBC551C60_2.png"],"audio":""},{"n":"д. Рудка","d":"Район: Пинский район\nЛюдей до войны: 294\nДомов до войны: 68\nУбито людей: 6\nРазрушено домов: 37\nДата уничтожения: июль 1944г.\nОбелиск установлен в 1968 г. В июле 1941 г. деревни Велесница и Рудка были сожжены немецко-фашистскими захватчиками.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":21.3275,"y":41.3763,"lat":52.2672856,"lng":25.8707698,"gmaps":"https://www.google.com/maps/place/52.26729,25.87077","imgs":["assets/img/5799003E563627B5_1.png"],"audio":""},{"n":"д. Семеховичи","d":"Район: Пинский район\nЛюдей до войны: 320\nДомов до войны: 82\nУбито людей: 4\nРазрушено домов: 41\nДата уничтожения: 1944г.","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":18.8825,"y":75.974,"lat":51.9403987,"lng":25.7532065,"gmaps":"https://www.google.com/maps/place/51.94040,25.75321","imgs":[],"audio":"semehovichi"},{"n":"д. Теребень","d":"Район: Пинский\nЛюдей до войны: 695\nДомов до войны: 149\nУбито людей: 13\nРазрушено домов: 89\nДата уничтожения: май 1944г.\nВ июле 1943 г. группа карательного немецкого отряда СС с целью расправы, ворвались в деревню Теребень и сожгли хозяйство гражданина Кохновича Петра Андреевича вместе с ним и его семьей в количестве 6 человек: хозяин семьи – Кохнович Петр Андреевич, его жена Кохнович Татьяна и четверо детей в возрасте от 6 до 13 лет. Петра Кохновича обвинили в пререкании со старостой-коллаборантом. В назидание другим жителям семью Кохновича вместе с детьми палачи заперли в доме на хуторе, строения обложили соломой и подожгли.\n Памятный знак был установлен в 2025 г.\nБратская могила: Небольшой обелиск из железобетона был возведен в 1970 г.\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":55.5938,"y":63.432,"lat":52.1060596,"lng":26.2782868,"gmaps":"https://www.google.com/maps/place/52.10606,26.27829","imgs":["assets/img/57990530F5740050_1.png","assets/img/57990530F5740050_2.png"],"audio":"tereben"},{"n":"д. Торгошицы","d":"Район: Пинский район\nЛюдей до войны: 370\nДомов до войны: 110\nУбито людей: 3\nРазрушено домов: 30\nДата уничтожения: не установлено","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":27.7525,"y":60.6544,"lat":52.1552804,"lng":25.9715575,"gmaps":"https://www.google.com/maps/place/52.15528,25.97156","imgs":[],"audio":""},{"n":"д. Ласицк","d":"Довоенный район: Пинский\nДата уничтожения: март 1944 г.\nЛюдей до войны: 1200                                            Убито людей: 31\nРазрушено домов: 92\nВ 1978 году на месте захоронения был установлен обелиск.В захоронении покоятся 179 советских воинов, погибших при освобождении деревни Ласицк в 1944 году.В Братскую могилу советских воинов деревни Ласицк перезахоронены останки воинов из деревни Вешня.В 2015 году установлены 4 дополнительные надгробные плиты с 91 фамилией бойцов и офицеров Красной армии, погибших при освобождении деревень Трушево, Жолкино, Ласицк и Хутор Еловый Пинского района. \nПамятная доска установлена в 1979 г. на здании Дома культуры на увековечивание памяти Николая Степановича Ковалевича (1891-август 1941), уроженца д.Ласицк, участника гражданской войны, командира отряда «Смерть фашизму» в годы Великой Отечественной войны. \n\n\n\n\n\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":57.4375,"y":88.0178,"lat":51.9332331,"lng":26.2907334,"gmaps":"https://www.google.com/maps/place/51.93323,26.29073","imgs":["assets/img/4B067D1A32B8685F_1.png","assets/img/4B067D1A32B8685F_2.png"],"audio":"lasick"},{"n":"д. Площево","d":"Довоенный район: Пинский\nДата уничтожения: \tноябрь 1943 г.\nЛюдей до войны: 355\nДомов до войны: 94\nУбито людей: 3\nРазрушено домов: 90\nОбелиск установлен в 1968 году на западной окраине деревни на увековечение памяти земляков, которые погибли в годы Великой Отечественной войны.\nИз 94 подворий деревни после проведенной оккупантами карательной операции осталось лишь четыре. Прокурорские работники записали показания жительницы Площево 1932 года рождения:\n«…Насколько я помню, партизаны застрелили одного немецкого солдата. Из-за этого немцами была организована карательная операция. К тому времени, когда прибыли каратели, все жители уже знали об этом, собрали и вынесли за деревню свои вещи, да и сами ушли из домов. Скрылись в болотах за рекой Ясельдой, а потом разошлись жить по своякам. Тогда сожгли дома в деревне (90 домов из 94. — Прим. авт.), но никого не убили. Наша семья ушла жить к моему деду в деревню Березцы. А спустя некоторое время была организована карательная операция и в Березцах. Помню, что сначала над деревней пролетел самолет, а позже пришли солдаты. Тогда всех повыгоняли из домов, кто в чем был. Мой брат шел босиком по снегу. Немецкий солдат поставил пулемет, и мы думали, что нас расстреляют. Но в последний момент какой-то офицер дал приказ не стрелять...»\n\n","cat":"burned","catL":"Сожжённые деревни","src":"assets/icon/burned.png","w":1.875,"x":68.4688,"y":62.3373,"lat":52.1161586,"lng":26.4133021,"gmaps":"https://www.google.com/maps/place/52.11616,26.41330","imgs":["assets/img/4B068CACCE06E27C_1.png","assets/img/4B068CACCE06E27C_2.png"],"audio":""},{"n":"Лагерь для военнопленных","d":"Памятный знак «Памяти узников фашистских концлагерей»\nПериод существования: 1941 г. - март 1944 г.\nКоличество содержавшихся человек: около 20334\nКоличество убитых и умерших:  38342 по трем лагерям\nНедалеко от этого места гитлеровские захватчики создали лагерь для вывозимых в рабство полешуков. Число потерь среди жителей Пинщины и военнопленных превысило количество населения Пинска, оказавшегося в оккупации, а те, кто выжил, вернулись на родину с искалеченной душой.","cat":"detention","catL":"Места принудительного заключения","src":"assets/icon/detention.png","w":2.1429,"x":38.8625,"y":59.3917,"lat":52.1163881,"lng":26.0925558,"gmaps":"https://www.google.com/maps/place/52.11639,26.09256","imgs":["assets/img/4B06B1053D3E9D27_1.png"],"audio":""},{"n":"Пинское гетто","d":"Период существования: 01 мая 1942 г. - 28 октября 1942 г.\nКоличество содержавшихся человек: свыше 22000\nКоличество убитых и умерших: свыше 22000\n В мае 1942 года было создано Пинское еврейское гетто Это территория, куда принудительно выселили для проживания евреев. В Пинске она была ограничена улицами: Первомайской, Гоголя, Завальной, Кирова, Пушкина. В гетто вели 3 ворот: на ул. Листовского, ул. Южной, и ул. Альбрехтовской. Вдоль границ гетто была установлена полоса отчуждения. Пинчанам-арийцам, владевшим домами на территории гетто, которые оставляли свои дома, выделялись дома в других частях города. К 16 часам 1 мая 1942 г. все евреи Пинска были переселены в район гетто. Они оставляли в домах всё свое имущество: с собой разрешалось брать 2 пары белья, 2 комплекта одежды (рабочую и выходную), необходимую кухонную утварь. В оставленных домах оставляли вещи и мебель. Всю первую декаду мая шел грабеж оставленного евреями имущества. Из ближайших к Пинску деревень евреи были построены в колону, их вели по городу строем, переселенцам запрещалось брать с собой имущество.\nСюда сселяли евреев со всего города. Это была своего рода резервация для еврейского населения, покидать пределы которого строго запрещалось. Здесь был свой комендантский час. Представителям других национальностей запрещалось контактировать с евреями. После создания гетто «жизненное пространство», выделенное для евреев Пинска, значительно уменьшилось. 18 644 человек вынуждены были разместиться в 446 домах, на каждого жителя гетто приходилось 1,8 м/2 общей площади, а в среднем в каждом доме проживало свыше 40 человек. Имущество, покинутое хозяевами при переселении в гетто, - дрова, строительные материалы и пр. – централизовано собиралось и также поступало в распоряжение городского управления. Удовлетворялись заявки городских организаций и частных лиц на те или иные предметы, оставленные во дворах. Кроме того, уже с конца апреля, в магистрат стали поступать прошения от местных жителей о разрешении занять брошенные еврейские квартиры и дома, по неполным данным таких заявок поступило около 300. Вселившиеся горожане становились пользователями еврейского имущества, которое передавалось им на хранение. \nОперация по уничтожению гетто началась в октябре 1942 года. Территория гетто была оцеплена гитлеровцами, евреев строили в колоны и гнали к месту казни, которая была уготована им в урочище Добрая Воля.\nТам поджидали их вырытые траншеи. За три дня операции, проведенной фашистами, было расстреляно порядка 29 тысяч человек. Из них 17 тыс. – пинские евреи. Кроме пинских евреев здесь уничтожали евреев из других населенных пунктов - в частности Столина и Мотоля","cat":"detention","catL":"Места принудительного заключения","src":"assets/icon/detention.png","w":2.1429,"x":42.3456,"y":57.5686,"lat":52.1223791,"lng":26.1126639,"gmaps":"https://www.google.com/maps/place/52.12238,26.11266","imgs":["assets/img/4B06AE4BDD7B954C_1.png","assets/img/4B06AE4BDD7B954C_2.png"],"audio":"pinskoe-getto"},{"n":"Тюрьма","d":"Период существования: в пределах периода оккупации\nКоличество содержавшихся человек: не установлено\nКоличество убитых и умерших: не установлено.\nЗа 1941-1943 есть списки служащих и полицейских, переписка с городским управлением, пекарнями г. Пинска о снабжении тюрьмы продуктами питания, удостоверения об освобождении из-под ареста заключенных.","cat":"detention","catL":"Места принудительного заключения","src":"assets/icon/detention.png","w":2.1429,"x":38.0831,"y":60.1071,"lat":52.112687,"lng":26.085062,"gmaps":"https://www.google.com/maps/place/52.11269,26.08506","imgs":["assets/img/4B06AA7C461C468C_1.png","assets/img/4B06AA7C461C468C_2.png","assets/img/4B06AA7C461C468C_3.png"],"audio":""},{"n":"«Пинское гетто - центральный вход","d":"Памятник установили в 2024 г. в центральной части города, на пешеходном участке улицы Ленинградской, где она примыкает к площади Кирова. Именно в этом месте находился центральный вход в Пинское гетто. Архитекторы изобразили на монументе стаю взмывающих в небо птиц.\nПривлекает внимание и надпись, сделанная на русском и английском языках: «Памяти жертв нацизма. Здесь в 1942 году находился центральный вход в Пинское гетто». \nЭто была территория, куда принудительно выселили евреев, которых на то время в городе проживало 50% от всего населения. Операция по уничтожению гетто началась 28 октября 1942 года в урочище Добрая Воля. За три дня было расстреляно около 29 тыс. человек, из них 17 тыс. — пинские евреи.","cat":"detention","catL":"Места принудительного заключения","src":"assets/icon/detention.png","w":2.1429,"x":40.9175,"y":58.5213,"lat":52.1189599,"lng":26.1077381,"gmaps":"https://www.google.com/maps/place/52.11896,26.10774","imgs":["assets/img/57A324EC857D2A7A_1.png"],"audio":"pinskoe-getto"},{"n":"Лагерь гражданского населения","d":"Период существования: 1941 г. - 1944 г.\nКоличество содержавшихся человек: не установлено\nКоличество убитых и умерших: всего уничтожено по трем лагерям и лагере-гетто в г. Пинске 38342 человека","cat":"detention","catL":"Места принудительного заключения","src":"assets/icon/detention.png","w":2.1429,"x":38.7469,"y":59.2521,"lat":52.117016,"lng":26.09087,"gmaps":"https://www.google.com/maps/place/52.11702,26.09087","imgs":["assets/img/4B06A56DD705E585_1.png"],"audio":""},{"n":"Гетто в г.п.Логишин","d":"Период существования: июнь-сентябрь 1941 года.  Обелиск установлен в 1990г.\nВ августе (сентябре) 1941  города в ходе «акции»  все ещё живые евреи были расстреляны — от 300 до 1605 человек по разным данным. 23 еврея из Логишина летом-осенью 1941 года были перемещены в гетто в Пинске и убиты уже там.","cat":"detention","catL":"Места принудительного заключения","src":"assets/icon/detention.png","w":2.1429,"x":30.8437,"y":31.0355,"lat":52.332526,"lng":25.994252,"gmaps":"https://www.google.com/maps/place/52.33253,25.99425","imgs":["assets/img/57A2FE6D1EC81238_1.png"],"audio":"logishin"},{"n":"Погост-Загородское гетто","d":"Памятная табличка установлена в 2018 году на камне, где есть информация о размещении в 1941-1942гг. на данной улице еврейского гетто, узники которого были расстреляны 15 августа 1942 года, а гетто - сожжено.\nДо Великой Отечественной войны еврейское население составляло абсолютное большинство жителей Погост-Загородского. С приходом вермахта в июле 1941 года местечко покинули лишь единицы — основная масса людей осталась. В рамках нацистской политики «окончательного решения» в конце того же года здесь было создано гетто. Кульминацией стало 15 августа 1942 года: узников согнали в синагогу, а после полудня вывели к лесопилке и расстреляли у дороги. Многие получили лишь ранения, и предсмертные крики были слышны далеко вокруг. На следующий день, благодаря доносу, нацисты обнаружили убежище с 27 прятавшимися евреями — в основном детьми и подростками — и казнили их в огороде местного жителя Николая Мишеревича. Итогом этой «акции» (термин, которым немцы прикрывали массовые убийства) стало уничтожение около 1200 человек, то есть практически всего еврейского сообщества Погост-Загородского, к середине августа 1942 года.","cat":"detention","catL":"Места принудительного заключения","src":"assets/icon/detention.png","w":2.1429,"x":62.6562,"y":32.6923,"lat":52.322418,"lng":26.349152,"gmaps":"https://www.google.com/maps/place/52.32242,26.34915","imgs":["assets/img/5D8CBF201C405470_1.png"],"audio":"pogost-zagorodskiy"},{"n":"Мемориал в память расстреляных мирных жителей в д. Погост-Загородский","d":"Архивы хранят свидетельства того, что в годы оккупации на местном кладбище хоронили расстрелянных мирных жителей и умерших от сыпного тифа из окрестных деревень. Это место стало общей братской могилой для людей разной веры, которых объединила трагическая участь жертв нацистского террора.\nПамять об этих событиях обрела материальное воплощение спустя 76 лет. 5 августа 2018 года на деревенском кладбище состоялось открытие и освящение мемориала. Инициатором установки памятника и автором его эскиза выступил уроженец Погоста Александр Казак.\nАрхитектурное решение мемориала глубоко символично: шесть мраморных стел, изломанных сверху, словно надломленные человеческие судьбы, которые война оборвала на взлёте. Они установлены на месте шести могил, в которых захоронено более пятидесяти местных жителей. Главная особенность памятника — его исповедальная многоконфессиональность. На поверхностях стел выбиты три священных символа: православный крест, католический крест и еврейская семисвечная менора, что подчёркивает общую боль всех жертв войны, независимо от их вероисповедания.\nОткрытие мемориала, по словам его создателя Александра Казака, стало символическим завершением войны для этой местности: «Война не закончена, пока не похоронены последний её солдат, последняя её жертва. С установкой памятного знака война для нашей местности закончилась».\n\n","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":62.6562,"y":32.6923,"lat":52.328013,"lng":26.348513,"gmaps":"https://www.google.com/maps/place/52.32801,26.34851","imgs":["assets/img/5D8CC47927D8AA7C_1.png"],"audio":"pogost-zagorodskiy"},{"n":"Братская могила узников гетто, г. Пинск (б. Козляковичи)","d":"В 1993 году установлен мемориальный знак. Здесь, на территории нынешней школы ДОСААФ, в урочище Горы, в 1941—1942 годах немцы убивали евреев из Пинского гетто, узников городской тюрьмы и военнопленных. Согласно последним данным, всего в начале августа 1941 г. возле дд. Посеничи и Козляковичи было расстреляно не менее 5 300 пинских евреев (65 % еврейского мужского населения города). ","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":33.0544,"y":62.2769,"lat":52.1087016,"lng":26.0557783,"gmaps":"https://www.google.com/maps/place/52.10870,26.05578","imgs":["assets/img/57A316ADBDF2E7D5_1.png"],"audio":"kozlyakovichi"},{"n":"Братская могила жертв войны д.Посеничи","d":"Возле дороги Пинск-Логишин, в 0,5 км к югу от деревни похоронено 26 тыс. жителей г.Пинска еврейской национальности, расстрелянных фашистами в августе 1941г., а также военнопленные. ","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":40.2188,"y":53.284,"lat":52.169401,"lng":26.0894,"gmaps":"https://www.google.com/maps/place/52.16940,26.08940","imgs":["assets/img/57A2F9D3847244F1_1.png"],"audio":"posenichi"},{"n":"Памятный знак гибели заживо сожженных жителей, г.п. Логишин","d":"Памятный знак 15 мирным жителям поселка, заживо сожженных немецкими оккупантами 9 февраля 1943 года в урочище «Черный луг» за связь с партизанами. Памятный знак установлен на месте трагедии в 2009 году. Сначала памятник представлял собой символические ворота с набатным колоколом. Теперь на этом месте насыпан невысокий курган, над которым возвышается крест с распятием, а возле него установлен камень-валун с мемориальной доской. Останки погибших, среди которых были и малолетние дети, захоронены на местном кладбище.","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":31.8125,"y":31.0355,"lat":52.3379711,"lng":25.9864952,"gmaps":"https://www.google.com/maps/place/52.33797,25.98650","imgs":["assets/img/57A3072876CB0E54_1.png","assets/img/57A3072876CB0E54_2.png"],"audio":"logishin"},{"n":"Памятник землякам, д.Кончицы","d":"Обелиск установлен в 1968 г. возле Дома культуры на увековечивание памяти односельчан, которые погибли в годы Великой Отечественной войны. ","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":15.18,"y":63.868,"lat":52.06739999971,"lng":25.81559999974,"gmaps":"https://www.google.com/maps/place/52.06740,25.81560","imgs":["assets/img/57903B725644C2C7_1.png"],"audio":""},{"n":"Памятник Землякам, д. Житновичи","d":"Обелиск установлен в 1967 г. возле клуба на увековечивание памяти 37 жителей деревень Большая Вулька, Житновичи, Изин, которые погибли в годы Великой Отечественной войны. ","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":29.5,"y":70.0592,"lat":52.06119999978,"lng":25.981499999725,"gmaps":"https://www.google.com/maps/place/52.06120,25.98150","imgs":["assets/img/57903DC06B66FD4B_1.png"],"audio":""},{"n":"Памятник землякам, д.Дубое","d":"Обелиск установлен в 1968 г. на увековечивание памяти 30 жителей деревень Беркозы, Дубой, Сосновичи и Стаховичи, которые погибли в годы Великой Отечественной войны. ","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":11.0938,"y":65.5917,"lat":52.093099999565,"lng":25.77920000018,"gmaps":"https://www.google.com/maps/place/52.09310,25.77920","imgs":["assets/img/579040677B390A49_1.png"],"audio":""},{"n":"Памятник На месте гибели мирных граждан, д. Понятичи","d":"Обелиск установлен возле железной дороги в 1967 г. в память о 14 работниках 5-й дистанции пути белорусской железной дороги, которые были расстреляны в 1943 г. ","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":17.125,"y":58.9349,"lat":52.11940000011,"lng":25.83359999974,"gmaps":"https://www.google.com/maps/place/52.11940,25.83360","imgs":["assets/img/579042BF8536D462_1.png"],"audio":""},{"n":"Обелиск Землякам, д. Домашицы","d":"В память о 39 жителях деревень Домашицы, Жабчицы, Залесье, Молотковичи. Обелиск установлен в 1968 г. ","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":27.9062,"y":63.1657,"lat":52.10751332428,"lng":25.966186988739,"gmaps":"https://www.google.com/maps/place/52.10751,25.96619","imgs":["assets/img/5792A18B3C61AF26_1.png"],"audio":""},{"n":"Мемориал \"Жертвам холокоста\" в урочище Добрая Воля","d":"Памятный знак установлен в 1993г.,  высечен из гранитного монолита. В его верхней части, ориентированные на запад и восток – два круглых лика. Это стилизованное изображение скорбящих женщин, стоящих спиной друг к другу и взирающих на окружающее поле – место расстрела невинных жертв. \n\nНа прилегающей к памятнику округлой площадке находится 3 плиты высотой около 0,5м с надписями: “Памяти жертв фашизма еврейского населения г.Пинска и окрестностей, партизан, подпольщиков и военнопленных 1941-1944гг.\" , а по обеим сторонам: \"В память жертвам фашизма около 20000 евреев Пинска и окрестностей, партизан, подпольщиков и военнопленных 1941-1944гг\".","cat":"graves","catL":"Массовые захоронения / места казни","src":"assets/icon/graves.png","w":1.875,"x":43.7394,"y":54.5012,"lat":52.1531773,"lng":26.130202,"gmaps":"https://www.google.com/maps/place/52.15318,26.13020","imgs":["assets/img/5BF0CE6FDE49FF84_1.png"],"audio":"dobraya-volya"}];

// ————————————————————————————————————————————————————————————————
// Страница «Аудиогиды» в WordPress.
// Локально это ?page_id=34. При переезде на хостинг номер страницы обычно
// другой — поэтому карта сама находит её через REST API WordPress (страница,
// в которую вставлен аудиогид) и подставляет найденный номер.
// Если WordPress или API недоступны — ссылка ведёт прямо на страницу
// аудиогида (../audioguide/index.html), она работает в любом случае.
// ————————————————————————————————————————————————————————————————
// 0 = номер страницы ещё не известен. В этом случае ссылка ведёт прямо на
// страницу аудиогида (../audioguide/index.html) — она работает всегда, в
// отличие от угаданного номера. Настоящий номер подставит resolveAudioPage().
let AG_PAGE_ID = 0;
let AG_CACHED = false;                     // номер уже находили и проверяли раньше
try {
  const saved = localStorage.getItem('pinsk_ag_page_id');
  if (saved && /^\d+$/.test(saved)) { AG_PAGE_ID = +saved; AG_CACHED = true; }
} catch (e) {}

function audioPageUrl(slug) {
  if (AG_PAGE_ID > 0) return '../?page_id=' + AG_PAGE_ID + '#p-' + slug;
  return '../audioguide/index.html#p-' + slug;               // без WordPress
}

function resolveAudioPage() {
  if (typeof fetch !== 'function') return;
  const fallbackTo34 = () => {                     // REST не ответил
    if (AG_CACHED) return;                         // найденный ранее номер надёжнее догадки
    fetch('../?page_id=34', {credentials: 'same-origin'})
      .then(r => (r.ok ? r.text() : ''))
      .then(html => { AG_PAGE_ID = html.indexOf('audioGuide') >= 0 ? 34 : 0; })
      .catch(() => { AG_PAGE_ID = 0; });           // не WordPress или файл открыт напрямую
  };

  // orderby=modified: на сайте с сотнями страниц свежая страница с аудиогидом
  // попадёт в первые сто; per_page=100 — максимум, который отдаёт WordPress.
  fetch('../?rest_route=/wp/v2/pages&per_page=100&orderby=modified&order=desc&_fields=id,title,content', {credentials: 'same-origin'})
    .then(r => (r.ok ? r.json() : Promise.reject('rest')))
    .then(list => {
      if (!Array.isArray(list)) throw new Error('list');
      let best = null, bestScore = 0;
      list.forEach(p => {
        const title = ((p.title || {}).rendered || '').replace(/<[^>]+>/g, '').toLowerCase();
        const body  = ((p.content || {}).rendered || '').toLowerCase();
        if (body.indexOf('audioguide/') < 0) return;          // в этой странице нет аудиогида
        const score = title.indexOf('аудиогид') >= 0 ? 2 : 1; // по заголовку — приоритет
        if (score > bestScore) { bestScore = score; best = p; }
      });
      if (!best) { AG_PAGE_ID = 0; return; }                  // страница-обёртка не найдена
      AG_PAGE_ID = best.id;
      try { localStorage.setItem('pinsk_ag_page_id', String(best.id)); } catch (e) {}
    })
    .catch(fallbackTo34);
}
resolveAudioPage();

const stage = document.getElementById('stage');

NEW.forEach((m, i) => {

  img.title = m.n;

// legend with toggles
const vis = {};
const leg = document.getElementById('legend');
LEGEND.forEach(c => {
  vis[c.key] = true;
  const lab = document.createElement('label');
  const cb = document.createElement('input');
  cb.type = 'checkbox'; cb.checked = true; cb.className = 'cb';
  lab.innerHTML = '<img src="' + c.src + '" alt="">' +
                  '<span>' + esc(c.label) + '</span><span class="cnt">' + c.cnt + '</span>';
  lab.prepend(cb);
  cb.addEventListener('change', () => {
    vis[c.key] = cb.checked;
    pinLayer.querySelectorAll('.pin').forEach(p => {
      p.style.display = vis[p.dataset.cat] ? '' : 'none';
    });
  });
  leg.appendChild(lab);
});

const lb = document.getElementById('lb');
const lbIcon = document.getElementById('lbIcon');
const lbCat = document.getElementById('lbCat');
const lbTitle = document.getElementById('lbTitle');
const lbMeta = document.getElementById('lbMeta');
const lbAnno = document.getElementById('lbAnno');
const lbMedia = document.getElementById('lbMedia');
const lbThumbs = document.getElementById('lbThumbs');
let curImg = 0;

function showImg(src){
  lbMedia.innerHTML = '';
  if (!src) return;
  const img = document.createElement('img');
  img.src = src;
  img.alt = 'Фотография';
  img.onerror = () => { lbMedia.innerHTML = ''; };
  lbMedia.appendChild(img);
  Array.prototype.forEach.call(lbThumbs.querySelectorAll('img'), (t, i) => {
    t.classList.toggle('on', i === curImg);
  });
}

function openLB(i){
  curImg = 0;
  const m = NEW[i];
  lbIcon.src = m.src; lbIcon.alt = m.n;
  lbCat.textContent = m.catL;
  lbTitle.textContent = m.n;
  lbMeta.innerHTML = '';
  const s = document.createElement('span'); s.textContent = '📍 ' + m.lat.toFixed(5) + ', ' + m.lng.toFixed(5); lbMeta.appendChild(s);
  if (m.audio){
    const au = document.createElement('a');
    au.className = 'lb-audio';
    au.href = audioPageUrl(m.audio);
    au.target = '_blank';
    au.rel = 'noopener';
    au.textContent = '🎧 Слушать аудиогид';
    lbMeta.appendChild(au);
  }
  lbAnno.textContent = m.d || 'Описание отсутствует.';
  lbThumbs.innerHTML = '';
  lbMedia.innerHTML = '';
  lbMedia.style.display = '';
  lbThumbs.style.display = '';
  if (m.imgs && m.imgs.length){
    m.imgs.forEach((src, i) => {
      const t = document.createElement('img');
      t.src = src;
      t.alt = '';
      t.classList.toggle('on', i === 0);
      t.addEventListener('click', () => { curImg = i; showImg(m.imgs[i]); });
      lbThumbs.appendChild(t);
    });
    showImg(m.imgs[0]);
  } else {
    lbMedia.style.display = 'none';
    lbThumbs.style.display = 'none';
  }
  lb.classList.add('open');
}
function closeLB(){ lb.classList.remove('open'); }
document.getElementById('lbClose').addEventListener('click', closeLB);
document.getElementById('lbBackdrop').addEventListener('click', closeLB);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLB(); });

function setZoom(v){ zoom = Math.min(3, Math.max(1, Math.round(v*10)/10)); stage.style.setProperty('--zoom', zoom); document.getElementById('zres').textContent = Math.round(zoom*100)+'%'; }
document.getElementById('zin').addEventListener('click', () => setZoom(zoom + .3));
document.getElementById('zout').addEventListener('click', () => setZoom(zoom - .3));
document.getElementById('zres').addEventListener('click', () => setZoom(1));
view.addEventListener('wheel', e => { if (e.ctrlKey){ e.preventDefault(); setZoom(zoom + (e.deltaY < 0 ? .2 : -.2)); } }, {passive:false});

function esc(s){ return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
</script>
</body>
</html>
